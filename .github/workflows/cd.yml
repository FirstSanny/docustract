name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger Render Deploy
        run: curl -X POST "$RENDER_API_URL/services/$RENDER_SERVICE_ID/deploys"
        env:
          RENDER_API_URL: ${{ vars.RENDER_API_URL }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

  smoke-test:
    name: Smoke Test
    needs: deploy
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for deploy
        run: sleep 30

      - name: Smoke test health endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" "$RENDER_DEPLOY_URL/health")
          if [ "$response" = "200" ]; then
            echo "Health check passed: $response"
          else
            echo "Health check failed: $response"
            exit 1
          fi
        env:
          RENDER_DEPLOY_URL: ${{ vars.RENDER_DEPLOY_URL }}
